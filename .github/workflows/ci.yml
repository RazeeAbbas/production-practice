name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/uncle-jams-recipes:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/uncle-jams-recipes:${{ steps.vars.outputs.sha_short }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uncle-jams-recipes:latest
            sudo docker stop uncle-jams-app || true
            sudo docker rm uncle-jams-app || true
            sudo docker run -d \
              -p 5001:5000 \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e MONGO_DBNAME="recipes_db" \
              -e SECRET_KEY="mysecretkey123" \
              --log-driver=awslogs \
              --log-opt awslogs-region=us-east-1 \
              --log-opt awslogs-group=/aws/ec2/uncle-jams-app \
              --log-opt awslogs-create-group=true \
              --name uncle-jams-app \
              ${{ secrets.DOCKERHUB_USERNAME }}/uncle-jams-recipes:latest